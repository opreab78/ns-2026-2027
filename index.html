<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Competițional U15 / U16</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-radius: 0.5rem; transition: all 0.2s; font-size: 0.95rem; font-weight: 600; color: #334155; }
        .day-cell.empty { background: transparent; cursor: default; }
        .day-cell:not(.empty) { background-color: #ffffff; border: 1px solid #cbd5e1; cursor: pointer; }
        .day-cell:not(.empty):hover { background-color: #f1f5f9; border-color: #94a3b8; }
        .day-cell.has-event { font-weight: bold; background-color: #f8fafc; }
        .day-cell.active { background-color: #2563eb !important; color: white !important; border-color: #1d4ed8 !important; }
        .dots-container { display: flex; gap: 4px; margin-top: 4px; height: 6px; }
        .comp-dot { width: 6px; height: 6px; border-radius: 50%; }
        .day-cell.active .comp-dot { border: 1px solid rgba(255,255,255,0.5); }
    </style>
</head>

    <div class="max-w-4xl mx-auto">

        <header class="mb-6 border-b border-slate-200 pb-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 id="main-title" class="text-3xl font-extrabold text-blue-900">⚽ Calendar U15</h1>

            </div>
            <!-- BUTOANE COMUTARE U15 / U16 -->
            <div class="flex bg-slate-200 p-1.5 rounded-xl w-full md:w-auto justify-center">

                <button id="btn-u16" onclick="switchCategory('U16')" class="flex-1 md:flex-none px-8 py-2.5 rounded-lg text-base font-bold transition text-slate-700 hover:text-slate-900">U16</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- COLOANA STÂNGA: CALENDAR + FILTRE + EXPORT -->
            <div class="md:col-span-1 space-y-4">
                <div class="bg-white p-4 md:p-5 rounded-2xl border border-slate-200 shadow-sm sticky top-4">
                    <div class="flex justify-between items-center mb-4">
                        <button onclick="changeMonth(-1)" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold transition flex items-center justify-center text-lg">&lt;</button>
                        <h2 id="month-year-display" class="font-bold text-slate-800 text-base uppercase tracking-wide"></h2>
                        <button onclick="changeMonth(1)" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold transition flex items-center justify-center text-lg">&gt;</button>
                    </div>
                    <div class="calendar-grid text-xs text-slate-500 font-bold mb-2 text-center">
                        <div>Lu</div><div>Ma</div><div>Mi</div><div>Jo</div><div>Vi</div><div>Sâ</div><div>Du</div>
                    </div>
                    <div id="calendar-days" class="calendar-grid"></div>
                    
                    <div id="filter-status" class="mt-4 hidden p-3 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-900 font-medium flex justify-between items-center">
                        <span id="filter-date-text"></span>
                        <button onclick="clearDateFilter()" class="text-xs font-bold text-blue-700 hover:text-blue-900 underline">Resetează</button>
                    </div>

                    <!-- FILTRE COMPETIȚII SUB CALENDAR -->
                    <div class="mt-5 pt-4 border-t border-slate-100">
                        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5">Filtrează competiția:</p>
                        <div class="flex flex-col gap-2 text-sm">
                            <button onclick="setCompetitionFilter('all')" id="filter-btn-all" class="px-3.5 py-2.5 rounded-xl font-bold bg-blue-600 text-white transition text-left flex justify-between items-center shadow-sm">
                                <span>Toate competițiile</span>
                                <i class="fa-solid fa-check"></i>
                            </button>
                            <button onclick="setCompetitionFilter('Campionatul Național')" id="filter-btn-camp" class="px-3.5 py-2.5 rounded-xl font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition text-left flex items-center gap-2.5">
                                <div class="w-3 h-3 rounded-full bg-emerald-500"></div> Campionat Național
                            </button>
                            <button onclick="setCompetitionFilter('Cupa Național')" id="filter-btn-cupan" class="px-3.5 py-2.5 rounded-xl font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition text-left flex items-center gap-2.5">
                                <div class="w-3 h-3 rounded-full bg-sky-500"></div> Cupa Națională
                            </button>
                            <button onclick="setCompetitionFilter('Cupa Elitelor')" id="filter-btn-elite" class="px-3.5 py-2.5 rounded-xl font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition text-left flex items-center gap-2.5">
                                <div class="w-3 h-3 rounded-full bg-rose-500"></div> Cupa Elitelor
                            </button>
                        </div>
                    </div>

                    <!-- BUTON EXPORT .ICS -->
                    <div class="mt-4 pt-4 border-t border-slate-100">
                        <button onclick="exportToICS()" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
                            <i class="fa-solid fa-file-arrow-down text-base"></i> Exportă calendarul (.ics)
                        </button>
                    </div>
                </div>
            </div>

            <!-- COLOANA DREAPTA: LISTA MECIURI -->
            <div class="md:col-span-2 space-y-4" id="events-list"></div>
            
        </div>
    </div>

            { date: "2027-05-15", title: "Etapa 24", comp: "Campionatul Național U16", time: "", opponent: "", location: "", lat: "", lng: "", home: "Gazde", away: "Adversari", score: "", scorers: "" },
            { date: "2027-05-22", title: "Etapa 25", comp: "Campionatul Național U16", time: "", opponent: "", location: "", lat: "", lng: "", home: "Gazde", away: "Adversari", score: "", scorers: "" },
            { date: "2027-05-29", title: "Etapa 26", comp: "Campionatul Național U16", time: "", opponent: "", location: "", lat: "", lng: "", home: "Gazde", away: "Adversari", score: "", scorers: "" },
            { date: "2027-06-05", title: "Etapa 27", comp: "Campionatul Național U16", time: "", opponent: "", location: "", lat: "", lng: "", home: "Gazde", away: "Adversari", score: "", scorers: "" }
        ];

        let currentCategory = 'U15';
        let currentCompetitionFilter = 'all';
        let currentMonth = 7;
        let currentYear = 2026;
        let selectedDate = null;
        const monthNames = ["Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie", "Iulie", "August", "Septembrie", "Octombrie", "Noiembrie", "Decembrie"];

        const compStyles = {
            "Campionatul Național": { badge: "bg-emerald-100 text-emerald-800 border-emerald-300", dot: "bg-emerald-500" },
            "Cupa Național": { badge: "bg-sky-100 text-sky-800 border-sky-300", dot: "bg-sky-500" },
            "Cupa Elitelor": { badge: "bg-rose-100 text-rose-800 border-rose-300", dot: "bg-rose-500" }
        };

        function getCompStyle(compName) {
            if (compName.includes("Campionatul Național")) return compStyles["Campionatul Național"];
            if (compName.includes("Cupa Național")) return compStyles["Cupa Național"];
            if (compName.includes("Cupa Elitelor")) return compStyles["Cupa Elitelor"];
            return { badge: "bg-slate-100 text-slate-800 border-slate-300", dot: "bg-slate-500" };
        }

        function getActiveData() {
            return currentCategory === 'U15' ? u15EventsData : u16EventsData;
        }

        function switchCategory(category) {
            currentCategory = category;
            selectedDate = null;
            document.getElementById('filter-status').classList.add('hidden');

            const btnU15 = document.getElementById('btn-u15');
            const btnU16 = document.getElementById('btn-u16');
            const mainTitle = document.getElementById('main-title');

            if (category === 'U15') {
                btnU15.className = "flex-1 md:flex-none px-8 py-2.5 rounded-lg text-base font-bold transition shadow bg-blue-600 text-white";
                btnU16.className = "flex-1 md:flex-none px-8 py-2.5 rounded-lg text-base font-bold transition text-slate-700 hover:text-slate-900";
                mainTitle.innerText = "⚽ Calendar U15";
            } else {
                btnU16.className = "flex-1 md:flex-none px-8 py-2.5 rounded-lg text-base font-bold transition shadow bg-blue-600 text-white";
                btnU15.className = "flex-1 md:flex-none px-8 py-2.5 rounded-lg text-base font-bold transition text-slate-700 hover:text-slate-900";
                mainTitle.innerText = "⚽ Calendar U16";
            }

            init();
        }

        function setCompetitionFilter(filterValue) {
            currentCompetitionFilter = filterValue;
            
            const filters = [
                { val: 'all', id: 'filter-btn-all' },
                { val: 'Campionatul Național', id: 'filter-btn-camp' },
                { val: 'Cupa Național', id: 'filter-btn-cupan' },
                { val: 'Cupa Elitelor', id: 'filter-btn-elite' }
            ];

            filters.forEach(f => {
                const btn = document.getElementById(f.id);
                if (f.val === filterValue) {
                    btn.classList.add("bg-blue-600", "text-white", "shadow-sm");
                    btn.classList.remove("bg-slate-100", "text-slate-700", "hover:bg-slate-200");
                    if(!btn.innerHTML.includes('fa-check')) btn.innerHTML += ` <i class="fa-solid fa-check ml-auto"></i>`;
                } else {
                    btn.classList.add("bg-slate-100", "text-slate-700", "hover:bg-slate-200");
                    btn.classList.remove("bg-blue-600", "text-white", "shadow-sm");
                    btn.innerHTML = btn.innerHTML.replace(/ <i class="fa-solid fa-check.*<\/i>/, '');
                }
            });

            renderCalendar();
            renderEvents();
        }

        function formatDateRO(dateStr) {
            const d = new Date(dateStr);
            return `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
        }

        function init() {
            const data = getActiveData();
            data.sort((a, b) => new Date(a.date) - new Date(b.date));
            renderCalendar();
            renderEvents();
        }

        function renderCalendar() {
            const data = getActiveData();
            const container = document.getElementById('calendar-days');
            container.innerHTML = '';
            document.getElementById('month-year-display').innerText = `${monthNames[currentMonth]} ${currentYear}`;
            
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const startDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < startDay; i++) {
                container.innerHTML += `<div class="day-cell empty"></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                let matchData = data.filter(e => e.date === dateStr);
                if (currentCompetitionFilter !== 'all') {
                    matchData = matchData.filter(e => e.comp.includes(currentCompetitionFilter));
                }
                
                const hasEvent = matchData.length > 0;
                const isActive = selectedDate === dateStr;
                
                let classes = "day-cell";
                if (hasEvent) classes += " has-event";
                if (isActive) classes += " active";

                let innerHtml = `<span>${i}</span>`;
                
                if (hasEvent) {
                    let uniqueComps = [...new Set(matchData.map(e => {
                        if (e.comp.includes("Campionatul Național")) return "Campionatul Național";
                        if (e.comp.includes("Cupa Național")) return "Cupa Național";
                        if (e.comp.includes("Cupa Elitelor")) return "Cupa Elitelor";
                        return "Altul";
                    }))];

                    let dotsHtml = `<div class="dots-container">`;
                    uniqueComps.forEach(comp => {
                        const style = getCompStyle(comp);
                        dotsHtml += `<div class="comp-dot ${style.dot}"></div>`;
                    });
                    dotsHtml += `</div>`;
                    innerHtml += dotsHtml;
                }

                container.innerHTML += `<div class="${classes}" onclick="toggleDate('${dateStr}')">${innerHtml}</div>`;
            }
        }

        function toggleDate(dateStr) {
            if (selectedDate === dateStr) {
                clearDateFilter();
            } else {
                selectedDate = dateStr;
                const d = new Date(dateStr);
                currentMonth = d.getMonth();
                currentYear = d.getFullYear();
                document.getElementById('filter-status').classList.remove('hidden');
                document.getElementById('filter-date-text').innerHTML = `Dată selectată: <strong>${formatDateRO(dateStr)}</strong>`;
                renderCalendar();
                renderEvents();
            }
        }

        function clearDateFilter() {
            selectedDate = null;
            document.getElementById('filter-status').classList.add('hidden');
            renderCalendar();
            renderEvents();
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function renderEvents() {
            const data = getActiveData();
            const list = document.getElementById('events-list');
            list.innerHTML = '';

            let filteredEvents = data;

            if (selectedDate) {
                filteredEvents = filteredEvents.filter(e => e.date === selectedDate);
            }

            if (currentCompetitionFilter !== 'all') {
                filteredEvents = filteredEvents.filter(e => e.comp.includes(currentCompetitionFilter));
            }

            if (filteredEvents.length === 0) {
                list.innerHTML = `<div class="bg-white p-8 text-center rounded-2xl border border-slate-200 text-slate-600 font-medium text-base">Nu sunt meciuri programate pentru filtrele selectate.</div>`;
                return;
            }

            filteredEvents.forEach(ev => {
                const style = getCompStyle(ev.comp);
                let detailsHTML = "";
                
                if (ev.time) {
                    detailsHTML += `<p class="flex items-center gap-2 text-base"><span class="text-slate-600 font-semibold min-w-[85px]">⌚ Oră:</span> <strong class="text-slate-900 font-bold">${ev.time}</strong></p>`;
                }
                
                if (ev.opponent) {
                    detailsHTML += `<p class="flex items-center gap-2 text-base mt-2"><span class="text-slate-600 font-semibold min-w-[85px]">🛡️ Adversar:</span> <strong class="text-slate-900 font-bold">${ev.opponent}</strong></p>`;
                } else {
                    detailsHTML += `<p class="flex items-center gap-2 text-base mt-2"><span class="text-slate-600 font-semibold min-w-[85px]">🛡️ Adversar:</span> <span class="text-slate-500 italic font-medium">Urmează să fie stabilit</span></p>`;
                }

                if (ev.location) {
                    detailsHTML += `<p class="flex items-center gap-2 text-base mt-2"><span class="text-slate-600 font-semibold min-w-[85px]">📍 Locație:</span> <strong class="text-slate-900 font-bold">${ev.location}</strong></p>`;
                }

                let mapButtonsHTML = "";
                if (ev.lat && ev.lng) {
                    mapButtonsHTML = `
                        <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap gap-2">
                            <a href="https://www.waze.com/ul?ll=${ev.lat},${ev.lng}&navigate=yes" target="_blank" class="bg-sky-50 text-sky-800 border border-sky-200 px-3 py-2.5 rounded-xl font-bold hover:bg-sky-100 transition flex items-center gap-1.5 text-sm shadow-sm flex-1 justify-center min-w-[85px]">
                                <i class="fa-brands fa-waze text-base"></i> Waze
                            </a>
                            <a href="https://www.google.com/maps/search/?api=1&query=${ev.lat},${ev.lng}" target="_blank" class="bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-2.5 rounded-xl font-bold hover:bg-emerald-100 transition flex items-center gap-1.5 text-sm shadow-sm flex-1 justify-center min-w-[85px]">
                                <i class="fa-solid fa-map-location-dot text-base"></i> Google
                            </a>
                            <a href="http://maps.apple.com/?q=${ev.lat},${ev.lng}" target="_blank" class="bg-slate-100 text-slate-800 border border-slate-200 px-3 py-2.5 rounded-xl font-bold hover:bg-slate-200 transition flex items-center gap-1.5 text-sm shadow-sm flex-1 justify-center min-w-[85px]">
                                <i class="fa-solid fa-location-arrow text-base"></i> Apple
                            </a>
                        </div>
                    `;
                }

                let scoreHTML = "";
                if (ev.score && ev.score.trim() !== "") {
                    let scorersHTML = "";
                    if (ev.scorers && ev.scorers.trim() !== "") {
                        const formattedScorers = ev.scorers.split('|').map(s => s.trim()).join(' • ');
                        scorersHTML = `
                            <div class="mt-2 text-sm font-medium text-slate-700 flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-futbol text-blue-600"></i>
                                <span class="font-bold">Goluri:</span> ${formattedScorers}
                            </div>
                        `;
                    }

                    scoreHTML = `
                        <div class="mt-4 pt-3 border-t border-slate-100 text-center">
                            <div class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Scor final</div>
                            <div class="inline-block text-lg font-extrabold text-blue-900 bg-blue-50 px-5 py-2 rounded-xl border border-blue-200 shadow-sm">
                                ${ev.home || 'Gazde'} ${ev.score} ${ev.away || 'Adversari'}
                            </div>
                            ${scorersHTML}
                        </div>
                    `;
                }

                list.innerHTML += `
                    <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition">
                        <div class="flex flex-wrap justify-between items-start mb-3 gap-2">
                            <div>
                                <h3 class="text-xl font-extrabold text-slate-900">${ev.title}</h3>
                                <div class="text-sm font-semibold text-slate-600 mt-0.5">${formatDateRO(ev.date)}</div>
                            </div>
                            <span class="text-xs font-extrabold px-3 py-1.5 rounded-xl border ${style.badge}">${ev.comp}</span>
                        </div>
                        <div class="my-3">${detailsHTML}</div>
                        ${mapButtonsHTML}
                        ${scoreHTML}
                    </div>
                `;
            });
        }

        function exportToICS() {
            const data = getActiveData();
            let eventsToExport = data;

            if (selectedDate) {
                eventsToExport = eventsToExport.filter(e => e.date === selectedDate);
            }
            if (currentCompetitionFilter !== 'all') {
                eventsToExport = eventsToExport.filter(e => e.comp.includes(currentCompetitionFilter));
            }

            if (eventsToExport.length === 0) {
                alert("Nu există evenimente de exportat pentru selecția curentă!");
                return;
            }

            let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Calendar Juniori RO//EN\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n";

            eventsToExport.forEach(ev => {
                let dateStr = ev.date.replace(/-/g, '');
                let timeStr = ev.time ? ev.time.replace(':', '') + '00' : '100000';
                let dtStart = `${dateStr}T${timeStr}`;
                
                let dtEnd = `${dateStr}T120000`;
                if(ev.time) {
                    let [hours, minutes] = ev.time.split(':').map(Number);
                    let endHours = (hours + 2) % 24;
                    dtEnd = `${dateStr}T${String(endHours).padStart(2, '0')}${String(minutes).padStart(2, '0')}00`;
                }

                let summary = `${ev.title} - ${ev.comp}`;
                let description = `Competitie: ${ev.comp}\\nAdversar: ${ev.opponent || 'N/ST'}\\nLocatie: ${ev.location || 'N/ST'}`;
                let location = ev.location || '';

                icsContent += "BEGIN:VEVENT\n";
                icsContent += `UID:${dateStr}-${Math.random().toString(36).substring(2)}@junioricalendar\n`;
                icsContent += `DTSTAMP:${dateStr}T000000Z\n`;
                icsContent += `DTSTART:${dtStart}\n`;
                icsContent += `DTEND:${dtEnd}\n`;
                icsContent += `SUMMARY:${summary}\n`;
                icsContent += `DESCRIPTION:${description}\n`;
                if(location) icsContent += `LOCATION:${location}\n`;
                icsContent += "END:VEVENT\n";
            });

            icsContent += "END:VCALENDAR";

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', `Calendar_${currentCategory}_${currentCompetitionFilter.replace(/\s+/g, '_')}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = init;
    </script>
</body>
