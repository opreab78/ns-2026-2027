        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-radius: 0.5rem; transition: all 0.2s; font-size: 0.95rem; font-weight: 600; color: #334155; }
        .day-cell.empty { background: transparent; cursor: default; }
        .day-cell:not(.empty) { background-color: #ffffff; border: 1px solid #cbd5e1; cursor: pointer; }
        .day-cell:not(.empty):hover { background-color: #f1f5f9; border-color: #94a3b8; }
        .day-cell.has-event { font-weight: bold; background-color: #f8fafc; }
        .day-cell.active { background-color: #2563eb !important; color: white !important; border-color: #1d4ed8 !important; }
        .dots-container { display: flex; gap: 4px; margin-top: 4px; height: 6px; }
        .comp-dot { width: 6px; height: 6px; border-radius: 50%; }
        .day-cell.active .comp-dot { border: 1px solid rgba(255,255,255,0.5); }
    
        .next-match{
            position:relative;overflow:hidden;
            border-radius:26px;
            padding:clamp(18px,4vw,28px);
            margin-bottom:18px;
            color:#fff;

              radial-gradient(circle at 82% 18%,rgba(56,189,248,.25),transparent 18rem),
              linear-gradient(135deg,#06132c 0%,#0a2b5e 58%,#123d7b 100%);
            box-shadow:0 20px 55px rgba(7,21,47,.22);
        }
        .next-match:before{
            content:"NEXT MATCH";position:absolute;left:50%;right:auto;top:18px;transform:translateX(-50%);
            font-size:.62rem;letter-spacing:.18em;font-weight:900;color:#7dd3fc;
        }
        .next-match-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
        .team-box{text-align:center;min-width:0}
        .team-crest{
            width:74px;height:74px;margin:0 auto 9px;border-radius:22px;
            display:flex;align-items:center;justify-content:center;
            background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
            font-family:'Manrope',sans-serif;font-size:1.15rem;font-weight:900;
            box-shadow:0 12px 30px rgba(0,0,0,.18);

        .team-name{font-family:'Manrope',sans-serif;font-size:clamp(.9rem,2vw,1.15rem);font-weight:900;line-height:1.15}
        .match-vs{font-size:1.15rem;font-weight:900;color:#93c5fd}
        .match-meta{text-align:center;margin-top:14px;color:#cbd5e1;font-size:.82rem;font-weight:700}
        .countdown{display:flex;justify-content:center;gap:7px;margin-top:16px}
        .countdown-unit{min-width:58px;padding:9px 7px;border-radius:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);text-align:center}
        .countdown-number{font-size:1.2rem;font-weight:900;color:#fff;line-height:1}

<script>
        function goHomeTop() {
            window.scrollTo({ top: 0, behavior: "smooth" });

            const home = document.querySelector('.bottom-nav button[aria-label="Acasă"]');
            if (home) home.classList.add("active");
        }

        function getTeamLogo(teamName) {
            return normalizedTeamLogos[normalizeTeamName(teamName)] || "";
        }

        function logoHTML(teamName, size = 54) {
            const logo = getTeamLogo(teamName);
            if (!logo) return `<div class="team-crest-fallback">${initials(teamName)}</div>`;
            return `<img src="${logo}" alt="${teamName}" class="team-crest-img" style="width:${size}px;height:${size}px" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="team-crest-fallback" style="display:none">${initials(teamName)}</span>`;
        }

        function getActiveData() {
            return currentCategory === 'U15' ? u15EventsData : u16EventsData;
        }

        function switchCategory(category) {
            currentCategory = category;
            selectedDate = null;
            const firstMatch = getActiveData().slice().sort((a,b) => new Date(a.date) - new Date(b.date))[0];
            if (firstMatch) {
                const d = new Date(firstMatch.date + "T12:00:00");
                currentMonth = d.getMonth();
                currentYear = d.getFullYear();
            }

            const btnU15 = document.getElementById('btn-u15');
            const btnU16 = document.getElementById('btn-u16');
            const mainTitle = document.getElementById('main-title');

            if (category === 'U15') {
                btnU15.className = "flex-1 md:flex-none px-8 py-2 rounded-lg text-base font-bold transition shadow bg-blue-600 text-white";
                btnU16.className = "flex-1 md:flex-none px-8 py-2 rounded-lg text-base font-bold transition text-slate-700 hover:text-slate-900";
                mainTitle.innerText = "New Stars - U15";
            } else {
                btnU16.className = "flex-1 md:flex-none px-8 py-2 rounded-lg text-base font-bold transition shadow bg-blue-600 text-white";
                btnU15.className = "flex-1 md:flex-none px-8 py-2 rounded-lg text-base font-bold transition text-slate-700 hover:text-slate-900";
                mainTitle.innerText = "New Stars - U16";
            }

            init();
        }

        function formatDateRO(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            return `${day} ${monthNames[month - 1]} ${year}`;
        }
function getNextMatch() {
            const today = new Date();
            today.setHours(0,0,0,0);
            return getActiveData()
                .filter(e => e.date && new Date(e.date + "T23:59:59") >= today)
                .sort((a,b) => new Date(a.date) - new Date(b.date))[0] || null;
        }

        function initials(name) {
            if (!name) return "?";
            const words = name.trim().split(/\s+/).filter(Boolean);
            return (words.length === 1 ? words[0].slice(0,2) : words.slice(0,2).map(w => w[0]).join("")).toUpperCase();
        }

        function renderNextMatch() {
            const ev = getNextMatch();
            const box = document.getElementById('next-match');
            if (!ev) {
                box.innerHTML = '<div class="text-center font-bold">Nu există momentan un meci următor cu adversar stabilit.</div>';
                return;
            }

            const home = (ev.home && ev.home !== "Gazde") ? ev.home : "New Stars";
            const opponentName = ev.opponent || ((ev.away && ev.away !== "Adversari") ? ev.away : "Adversar neconfirmat");
            box.dataset.matchDate = ev.date + (ev.time ? "T" + ev.time + ":00" : "T14:00:00");

            box.innerHTML = `
                <div class="next-match-grid">
                    <div class="team-box">
                        <div class="team-crest"><img src="sigla-New-Stars-Football-Club-sfinx-football.ro_.png" alt="New Stars" style="width:54px;height:54px;object-fit:contain"></div>
                        <div class="team-name">${home}</div>
                    </div>
                    <div class="text-center">
                        <div class="match-vs">VS</div>
                        <div class="text-xs font-bold text-slate-300 mt-1">${ev.title}</div>
                    </div>
                    <div class="team-box">
                        <div class="team-crest">${logoHTML(opponentName, 54)}</div>
                        <div class="team-name">${opponentName}</div>
                    </div>
                </div>
                <div class="match-meta">📅 ${formatDateRO(ev.date)} ${ev.time ? " · ⏰ " + ev.time : ""}${ev.location ? " · 📍 " + ev.location : ""}</div>
                <div id="countdown" class="countdown"></div>
            `;
            updateCountdown();
        }

        function updateCountdown() {
            const box = document.getElementById('next-match');
            const target = box?.dataset.matchDate;
            const out = document.getElementById('countdown');
            if (!target || !out) return;

            const diff = new Date(target).getTime() - Date.now();
            const safe = Math.max(0, diff);
            const d = Math.floor(safe / 86400000);
            const h = Math.floor((safe % 86400000) / 3600000);
            const m = Math.floor((safe % 3600000) / 60000);
            const s = Math.floor((safe % 60000) / 1000);

            out.innerHTML = `
                <div class="countdown-unit"><div class="countdown-number">${d}</div><div class="countdown-label">zile</div></div>
                <div class="countdown-unit"><div class="countdown-number">${String(h).padStart(2,'0')}</div><div class="countdown-label">ore</div></div>
                <div class="countdown-unit"><div class="countdown-number">${String(m).padStart(2,'0')}</div><div class="countdown-label">min</div></div>
                <div class="countdown-unit"><div class="countdown-number">${String(s).padStart(2,'0')}</div><div class="countdown-label">sec</div></div>
            `;
        }

        function renderForm() {
            const events = getActiveData()
                .filter(e => e.score && e.score.trim() !== "")
                .sort((a,b) => new Date(b.date) - new Date(a.date))
                .slice(0,5);

            const badges = document.getElementById('form-badges');
            if (!events.length) {
                badges.innerHTML = '<span class="text-xs font-bold text-slate-400">—</span>';
                return;
            }

            badges.innerHTML = events.reverse().map(e => {
                const parts = e.score.split(/[-:]/).map(x => parseInt(x.trim(),10));
                let cls = 'draw', letter = 'E';
                if (parts.length >= 2 && Number.isFinite(parts[0]) && Number.isFinite(parts[1])) {
                    const nsHome = e.home === "New Stars";
                    const gf = nsHome ? parts[0] : parts[1];
                    const ga = nsHome ? parts[1] : parts[0];
                    if (gf > ga) { cls = 'win'; letter = 'V'; }
                    else if (gf < ga) { cls = 'loss'; letter = 'Î'; }
                }
                return `<span class="form-badge ${cls}" title="${e.title}">${letter}</span>`;
            }).join('');
        }


        function renderRecentResults() {
            const el = document.getElementById('recent-results');
            const events = getActiveData()
                .filter(e => e.score && e.score.trim() !== "")
                .sort((a,b) => new Date(b.date) - new Date(a.date))
                .slice(0,5);

            if (!events.length) {
                el.innerHTML = '<div class="text-sm text-slate-400 font-semibold">Nu există încă rezultate introduse.</div>';
                return;
            }

            el.innerHTML = events.map(e => `
                <div class="flex items-center justify-between gap-3 rounded-xl border border-slate-100 bg-slate-50 px-3 py-2.5">
                    <div class="min-w-0">
                        <div class="flex items-center gap-2 min-w-0">
                            ${(e.home || "").trim().toLowerCase().includes("new stars") ? `<img src="${logo}" class="w-7 h-7 object-contain rounded-md" alt="New Stars">` : (getTeamLogo(e.home) ? `<img src="${getTeamLogo(e.home)}" class="w-7 h-7 object-contain rounded-md" alt="">` : '')}
                            <span class="text-xs font-black text-slate-800 truncate">${e.home || 'Gazde'} — ${e.away || 'Adversari'}</span>
                            ${(e.away || "").trim().toLowerCase().includes("new stars") ? `<img src="${logo}" class="w-7 h-7 object-contain rounded-md" alt="New Stars">` : (getTeamLogo(e.away) ? `<img src="${getTeamLogo(e.away)}" class="w-7 h-7 object-contain rounded-md" alt="">` : '')}
                        </div>
                        <div class="text-[11px] text-slate-500 font-semibold">${formatDateRO(e.date)}</div>
                    </div>
                    <div class="shrink-0 rounded-lg bg-white border border-slate-200 px-3 py-1.5 font-black text-slate-900">${e.score}</div>
                </div>
            `).join('');
        }

        function renderTimeline() {
            const el = document.getElementById('season-timeline');
            const data = [...getActiveData()].sort((a,b) => new Date(a.date) - new Date(b.date));
            el.innerHTML = data.map(e => `
                <div class="timeline-item">
                    <div class="timeline-date">${formatDateRO(e.date).replace(/ \d{4}$/,'')}</div>
                    <div class="timeline-event">${e.title}${e.opponent ? " · " + e.opponent : ""}</div>
                    <div class="timeline-comp">${e.comp.replace(/ U15| U16/g,'')}</div>
                </div>
            `).join('');
        }
function scrollToSection(id, button) {
            document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
            if (button) button.classList.add('active');
            const target = document.getElementById(id);
            if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
        }


        function init() {
            const data = getActiveData();
            data.sort((a, b) => new Date(a.date) - new Date(b.date));
            renderCalendar();
            renderEvents();
            renderNextMatch();
renderTimeline();
        }

        function renderCalendar() {
            const data = getActiveData();
            const container = document.getElementById('calendar-days');
            container.innerHTML = '';
            document.getElementById('month-year-display').innerText = `${monthNames[currentMonth]} ${currentYear}`;
            
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const startDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < startDay; i++) {
                container.innerHTML += `<div class="day-cell empty"></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                let matchData = data.filter(e => e.date === dateStr);
                const hasEvent = matchData.length > 0;
                const isActive = selectedDate === dateStr;
                
                let classes = "day-cell";
                if (hasEvent) classes += " has-event";
                if (isActive) classes += " active";

                let innerHtml = `<span>${i}</span>`;
                
                if (hasEvent) {
                    let uniqueComps = [...new Set(matchData.map(e => {
                        if (e.comp.includes("Campionatul Național")) return "Campionatul Național";
                        if (e.comp.includes("Cupa Național")) return "Cupa Național";
                        if (e.comp.includes("Cupa Elitelor")) return "Cupa Elitelor";
                        return "Altul";
                    }))];

                    let dotsHtml = `<div class="dots-container">`;
                    uniqueComps.forEach(comp => {
                        const style = getCompStyle(comp);
                        dotsHtml += `<div class="comp-dot ${style.dot}"></div>`;
                    });
                    dotsHtml += `</div>`;
                    innerHtml += dotsHtml;
                }

                container.innerHTML += `<div class="${classes}" onclick="toggleDate('${dateStr}')">${innerHtml}</div>`;
            }
        }

        function toggleDate(dateStr) {
            if (selectedDate === dateStr) {
                selectedDate = null;
            } else {
                selectedDate = dateStr;
                const [year, month] = dateStr.split('-').map(Number);
                currentMonth = month - 1;
                currentYear = year;
            }
            renderCalendar();
            renderEvents();
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function renderEvents() {
            const data = getActiveData();
            const list = document.getElementById('events-list');
            list.innerHTML = '';

            let filteredEvents = data;

            if (selectedDate) {
                filteredEvents = filteredEvents.filter(e => e.date === selectedDate);
            }

            if (filteredEvents.length === 0) {
                list.innerHTML = `<div class="bg-white p-8 text-center rounded-2xl border border-slate-200 text-slate-600 font-medium text-base">Nu sunt meciuri programate pentru data selectată.</div>`;
                return;
            }

            filteredEvents.forEach(ev => {
                const style = getCompStyle(ev.comp);
                const isCompletedMatch = typeof ev.score === "string" && ev.score.trim() !== "";

                // Upcoming match details.
                let detailsHTML = "";
                if (ev.time) {
                    detailsHTML += `<p class="flex items-center gap-2 text-base"><span class="text-slate-600 font-semibold min-w-[85px]">⌚ Oră:</span> <strong class="text-slate-900 font-bold">${ev.time}</strong></p>`;
                }
                if (ev.opponent) {
                    detailsHTML += `<p class="flex items-center gap-2 text-base mt-2"><span class="text-slate-600 font-semibold min-w-[85px]">🛡️ Adversar:</span> <strong class="text-slate-900 font-bold">${ev.opponent}</strong></p>`;
                } else {
                    detailsHTML += `<p class="flex items-center gap-2 text-base mt-2"><span class="text-slate-600 font-semibold min-w-[85px]">🛡️ Adversar:</span> <span class="text-slate-500 italic font-medium">Urmează să fie stabilit</span></p>`;
                }
                if (ev.location) {
                    detailsHTML += `<p class="flex items-center gap-2 text-base mt-2"><span class="text-slate-600 font-semibold min-w-[85px]">📍 Locație:</span> <strong class="text-slate-900 font-bold">${ev.location}</strong></p>`;
                }

                let mapButtonsHTML = "";
                if (ev.lat && ev.lng) {
                    mapButtonsHTML = `
                        <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap gap-2">
                            <a href="https://www.waze.com/ul?ll=${ev.lat},${ev.lng}&navigate=yes" target="_blank" class="bg-sky-50 text-sky-800 border border-sky-200 px-3 py-2.5 rounded-xl font-bold hover:bg-sky-100 transition flex items-center justify-center gap-1.5 text-sm shadow-sm flex-1">
                                <i class="fa-brands fa-waze text-base"></i> Waze
                            </a>
                            <a href="https://www.google.com/maps/search/?api=1&query=${ev.lat},${ev.lng}" target="_blank" class="bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-2.5 rounded-xl font-bold hover:bg-emerald-100 transition flex items-center justify-center gap-1.5 text-sm shadow-sm flex-1">
                                <i class="fa-solid fa-map-location-dot text-base"></i> Google
                            </a>
                            <a href="http://maps.apple.com/?q=${ev.lat},${ev.lng}" target="_blank" class="bg-slate-100 text-slate-800 border border-slate-200 px-3 py-2.5 rounded-xl font-bold hover:bg-slate-200 transition flex items-center justify-center gap-1.5 text-sm shadow-sm flex-1">
                                <i class="fa-solid fa-location-arrow text-base"></i> Apple
                            </a>
                        </div>
                    `;
                }

                // For completed matches: only goals and video are additional content.
                let scorersHTML = "";
                if (isCompletedMatch && ev.scorers && ev.scorers.trim() !== "") {
                    const formattedScorers = ev.scorers
                        .split('|')
                        .map(s => s.trim())
                        .filter(Boolean)
                        .join(' • ');

                    scorersHTML = `
                        <div class="completed-goals">
                            <i class="fa-solid fa-futbol"></i>
                            <span class="font-bold">Goluri:</span> ${formattedScorers}
                        </div>
                    `;
                }

                let videoLinksHTML = "";
                if (isCompletedMatch && ev.videoLinks && ev.videoLinks.length > 0) {
                    const linksBtns = ev.videoLinks.map(link => {
                        const isYoutube = link.url.includes('youtube.com') || link.url.includes('youtu.be');
                        const iconClass = isYoutube
                            ? 'fa-brands fa-youtube text-red-600'
                            : 'fa-solid fa-satellite-dish text-blue-600';

                        return `<a href="${link.url}" target="_blank" rel="noopener noreferrer" class="bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-800 px-3 py-2 rounded-xl text-sm font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                            <i class="${iconClass} text-base"></i> ${link.label}
                        </a>`;
                    }).join('');

                    videoLinksHTML = `
                        <div class="completed-video">
                            <div class="flex flex-wrap gap-2 justify-center">
                                ${linksBtns}
                            </div>
                        </div>
                    `;
                }

                // The score is deliberately part of the team board itself.
                // No completed-result / separate completed-result-score block is used.
                const completedResultHTML = isCompletedMatch ? `
                    <div class="completed-result">
                        <div class="completed-result-score">${ev.score}</div>
                    </div>
                ` : "";

                list.innerHTML += `
                    <div class="event-card bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition">
                        <div class="flex flex-wrap justify-between items-start mb-3 gap-2">
                            <div>
                                <h3 class="text-xl font-extrabold text-slate-900">${ev.title}</h3>
                                <div class="text-sm font-semibold text-slate-600 mt-0.5">${formatDateRO(ev.date)}</div>
                            </div>
                            <span class="text-xs font-extrabold px-3 py-1.5 rounded-xl border ${style.badge}">${ev.comp}</span>
                        </div>

                        <div class="event-matchup ${isCompletedMatch ? "event-matchup-completed" : ""}">
                            <div class="flex items-center gap-2 min-w-0 flex-1">
                                ${getTeamLogo(ev.home) ? `<img src="${getTeamLogo(ev.home)}" alt="${ev.home}" class="event-team-logo" loading="lazy">` : `<span class="event-team-logo-fallback">${initials(ev.home || "Gazde")}</span>`}
                                <span class="event-team-name truncate">${ev.home || "Gazde"}</span>
                            </div>

                            <div class="event-matchup-center">
                                <span class="event-vs">${isCompletedMatch ? "" : "VS"}</span>
                                ${completedResultHTML}
                            </div>

                            <div class="flex items-center gap-2 min-w-0 flex-1 justify-end">
                                <span class="event-team-name truncate text-right">${ev.away || "Adversari"}</span>
                                ${getTeamLogo(ev.away) ? `<img src="${getTeamLogo(ev.away)}" alt="${ev.away}" class="event-team-logo" loading="lazy">` : `<span class="event-team-logo-fallback">${initials(ev.away || "Adversari")}</span>`}
                            </div>
                        </div>

                        ${isCompletedMatch ? scorersHTML : ""}
                        ${isCompletedMatch ? "" : `<div class="my-3">${detailsHTML}</div>`}
                        ${isCompletedMatch ? "" : mapButtonsHTML}
                        ${videoLinksHTML}
                    </div>
                `;
            });
        }


        window.onload = init;
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
