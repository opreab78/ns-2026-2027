// --- INSTALL PWA: native install only ---
let deferredPrompt = null;
const installBtn = document.getElementById('install-btn');

function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
}

function showInstallButton() {
    if (!installBtn || isStandalone()) return;
    installBtn.classList.remove('hidden');
    installBtn.classList.add('flex');
}

function hideInstallButton() {
    if (!installBtn) return;
    installBtn.classList.add('hidden');
    installBtn.classList.remove('flex');
}

window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    deferredPrompt = event;
    showInstallButton();
});

window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    hideInstallButton();
});

        function normalizeTeamName(name) {
            return (name || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, " ")
                .trim();
        }

        const normalizedTeamLogos = Object.fromEntries(
            Object.entries(teamLogos).map(([name, logo]) => [normalizeTeamName(name), logo])
        );

        function getTeamLogo(teamName) {
            return normalizedTeamLogos[normalizeTeamName(teamName)] || "";
        }

        function logoHTML(teamName, size = 54) {
            const logo = getTeamLogo(teamName);
            if (!logo) return `<div class="team-crest-fallback">${initials(teamName)}</div>`;
            return `<img src="${logo}" alt="${teamName}" class="team-crest-img" style="width:${size}px;height:${size}px" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="team-crest-fallback" style="display:none">${initials(teamName)}</span>`;
        }

    const data = getActiveData();
    if (data && data.length) {
        const firstMatch = data.slice().sort((a,b) => new Date(a.date) - new Date(b.date))[0];
        if (firstMatch) {
            const d = new Date(firstMatch.date + "T12:00:00");
            currentMonth = d.getMonth();
            currentYear = d.getFullYear();
        }
    }

    const btnU15 = document.getElementById('btn-u15');

    if (btnU15) btnU15.className = category === 'U15' ? activeClasses : inactiveClasses;
    if (btnU16) btnU16.className = category === 'U16' ? activeClasses : inactiveClasses;

    if (stickyBtnU15) stickyBtnU15.className = category === 'U15' ? "sticky-category-btn active" : "sticky-category-btn";
    if (stickyBtnU16) stickyBtnU16.className = category === 'U16' ? "sticky-category-btn active" : "sticky-category-btn";

    if (mainTitle) mainTitle.innerText = "New Stars - " + category;

    // Re-render every category-dependent section.
    renderNextMatch();
    renderCalendar();

    renderTopScorers();
    updateCompetitionButtons();
}


        function formatDateRO(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            return `${day} ${monthNames[month - 1]} ${year}`;
        }
        
        function getNextMatch() {
            const data = getFilteredData();
            const now = new Date();
            return data
                .filter(e => e.date && !isCompletedMatch(e))
                .filter(e => {
                    const timeString = e.time ? e.time + ":00" : "23:59:59";
                    return new Date(`${e.date}T${timeString}`) >= now;
                })
                .filter(e => {
                    const {home, away} = getNewStarsHomeAway(e);
                    return home && away &&
                        normalizeTeamName(home) !== normalizeTeamName(away) &&
                        normalizeTeamName(home) !== 'gazde' &&
                        normalizeTeamName(away) !== 'adversari';
                })
                .sort((a,b) => new Date(`${a.date}T${a.time || '23:59'}:00`) - new Date(`${b.date}T${b.time || '23:59'}:00`))[0] || null;
        }

        
        function initials(name) {
            if (!name) return "?";
            const words = name.trim().split(/\s+/).filter(Boolean);
            return (words.length === 1 ? words[0].slice(0,2) : words.slice(0,2).map(w => w[0]).join("")).toUpperCase();
        }

        function renderNextMatch() {
            const ev = getNextMatch();
            const box = document.getElementById('next-match');
            if (!ev) {
                box.innerHTML = '<div class="text-center font-bold">Nu există momentan un meci următor cu adversar stabilit.</div>';
                return;
            }

            const {home, away} = getNewStarsHomeAway(ev);
            box.dataset.matchDate = ev.date + (ev.time ? "T" + ev.time + ":00" : "T14:00:00");

            box.innerHTML = `
                <div class="next-match-grid">
                    <div class="team-box">
                        <div class="team-crest">${logoHTML(home, 54)}</div>
                        <div class="team-name">${home}</div>
                    </div>
                    <div class="text-center">
                        <div class="next-match-competition">${ev.comp || ""}</div>
                        <div class="text-xs font-bold text-slate-300 mt-1">${ev.title || ""}</div>
                        <div class="match-vs">VS</div>
                    </div>
                    <div class="team-box">
                        <div class="team-crest">${logoHTML(away, 54)}</div>
                        <div class="team-name">${away}</div>
                    </div>
                </div>
                <div class="match-meta">📅 ${formatDateRO(ev.date)} ${ev.time ? " · ⏰ " + ev.time : ""}${ev.location ? " · 📍 " + ev.location : ""}</div>
                <div id="countdown" class="countdown"></div>
            `;
            updateCountdown();
        }
        function updateCountdown() {
            const box = document.getElementById('next-match');
            const target = box?.dataset.matchDate;
            const out = document.getElementById('countdown');
            if (!target || !out) return;

            const diff = new Date(target).getTime() - Date.now();
            const safe = Math.max(0, diff);
            const d = Math.floor(safe / 86400000);
            const h = Math.floor((safe % 86400000) / 3600000);
            const m = Math.floor((safe % 3600000) / 60000);
            const s = Math.floor((safe % 60000) / 1000);

            out.innerHTML = `
                <div class="countdown-unit"><div class="countdown-number">${d}</div><div class="countdown-label">zile</div></div>
                <div class="countdown-unit"><div class="countdown-number">${String(h).padStart(2,'0')}</div><div class="countdown-label">ore</div></div>
                <div class="countdown-unit"><div class="countdown-number">${String(m).padStart(2,'0')}</div><div class="countdown-label">min</div></div>
                <div class="countdown-unit"><div class="countdown-number">${String(s).padStart(2,'0')}</div><div class="countdown-label">sec</div></div>
            `;
        }

        function renderForm() {
            const events = getActiveData()
                .filter(e => e.score && e.score.trim() !== "")
                .sort((a,b) => new Date(b.date) - new Date(a.date))
                .slice(0,5);

            const badges = document.getElementById('form-badges');
            if (!events.length) {
                badges.innerHTML = '<span class="text-xs font-bold text-slate-400">—</span>';
                return;
            }

            badges.innerHTML = events.reverse().map(e => {
                const parts = e.score.split(/[-:]/).map(x => parseInt(x.trim(),10));
                let cls = 'draw', letter = 'E';
                if (parts.length >= 2 && Number.isFinite(parts[0]) && Number.isFinite(parts[1])) {
                    const nsHome = e.home === "New Stars";
                    const gf = nsHome ? parts[0] : parts[1];
                    const ga = nsHome ? parts[1] : parts[0];
                    if (gf > ga) { cls = 'win'; letter = 'V'; }
                    else if (gf < ga) { cls = 'loss'; letter = 'Î'; }
                }
                return `<span class="form-badge ${cls}" title="${e.title}">${letter}</span>`;
            }).join('');
        }

        function scrollToSection(id, button) {
            document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
            if (button) button.classList.add('active');
            const target = document.getElementById(id);
            if (target) target.scrollIntoView({behavior:'smooth', block:'start'});

        function renderTopScorers() {
            const scorerTitle = document.getElementById('scorers-title');
            if (scorerTitle) scorerTitle.textContent =
                activeCompetition === 'ALL'
                    ? `Golgheterii ${currentCategory}`
                    : `Golgheterii ${currentCategory} · ${activeCompetition}`;

            const container = document.getElementById('top-scorers');
            if (!container) return;

            const totals = {};

            getFilteredData().forEach(match => {
                if (!match.scorers || typeof match.scorers !== 'string') return;

                const scorerEntries = match.scorers
                    .split(/[,|]/)
                    .map(s => s.trim())
                    .filter(Boolean);

                scorerEntries.forEach(entry => {
                    const goals = (entry.match(/⚽/g) || []).length;
                    if (goals === 0) return;

                    const name = entry.replace(/⚽/g, '').trim();
                    if (!name) return;

                    totals[name] = (totals[name] || 0) + goals;
                });
            });

            const sortedScorers = Object.entries(totals)
                .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ro'));

            if (sortedScorers.length === 0) {
                container.innerHTML = '<div class="text-sm text-slate-400 font-semibold p-2">Niciun golgheter înregistrat încă.</div>';
                return;
            }

            container.innerHTML = sortedScorers.map((scorer, index) => {
                let medal = `<span class="text-slate-500 text-xs font-bold">${index + 1}</span>`;
                if (index === 0) medal = '🥇';
                else if (index === 1) medal = '🥈';
                else if (index === 2) medal = '🥉';

                return `
                <div class="flex items-center justify-between gap-3 rounded-xl border border-slate-100 bg-slate-50 px-3 py-2.5 mb-2 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-7 h-7 rounded-full bg-white border border-slate-200 flex items-center justify-center shadow-sm">
                            ${medal}
                        </div>
                        <span class="text-sm font-bold text-slate-800">${scorer[0]}</span>
                    </div>
                    <div class="shrink-0 rounded-lg bg-emerald-50 border border-emerald-200 px-3 py-1 font-black text-emerald-800">
                        ${scorer[1]} ⚽
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderCalendar() {
            const data = getFilteredData();
            const container = document.getElementById('calendar-days');
            container.innerHTML = '';
            document.getElementById('month-year-display').innerText = `${monthNames[currentMonth]} ${currentYear}`;
            
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const startDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < startDay; i++) {
                container.innerHTML += `<div class="day-cell empty"></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                let matchData = data.filter(e => e.date === dateStr);
                const hasEvent = matchData.length > 0;
                const isActive = selectedDate === dateStr;
                
                let classes = "day-cell";
                if (hasEvent) classes += " has-event";
                if (isActive) classes += " active";

                let innerHtml = `<span>${i}</span>`;
                
                if (hasEvent) {
                    let uniqueComps = [...new Set(matchData.map(e => {
                        if (e.comp.includes("Campionatul Național")) return "Campionatul Național";
                        if (e.comp.includes("Cupa Național")) return "Cupa Național";
                        if (e.comp.includes("Cupa Elite")) return "Cupa Elite";
                        return "Altul";
                    }))];

                    let dotsHtml = `<div class="dots-container">`;
                    uniqueComps.forEach(comp => {
                        const style = getCompStyle(comp);
                        dotsHtml += `<div class="comp-dot ${style.dot}"></div>`;
                    });
                    dotsHtml += `</div>`;
                    innerHtml += dotsHtml;
                }

                container.innerHTML += `<div class="${classes}" onclick="toggleDate('${dateStr}')">${innerHtml}</div>`;
            }
        }

        function toggleDate(dateStr) {
            if (selectedDate === dateStr) {
                selectedDate = null;
            } else {
                selectedDate = dateStr;
                const [year, month] = dateStr.split('-').map(Number);
                currentMonth = month - 1;
                currentYear = year;
            }
            renderCalendar();
            renderEvents();
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        let activeCompetition = 'ALL';

        function getCompetitionKey(comp) {
            const c = String(comp || '').toLowerCase();
            if (c.includes('campionatul național')) return 'Campionatul Național';
            if (c.includes('cupa național')) return 'Cupa National';
            if (c.includes('cupa elitelor')) return 'Cupa Elite';
            return 'ALL';
        }

        function normalizeCompetitionName(value) {
            return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();
        }

        function getFilteredData() {
            // IMPORTANT: păstrăm sursa existentă U15/U16 și filtrăm doar
            // competiția selectată. Nu folosim ID-uri de filtre inexistente.
            const data = getActiveData();

            if (activeCompetition === 'ALL') {
                return data.slice();
            }

            return data.filter(e => {
                const comp = normalizeCompetitionName(e.comp);

                if (activeCompetition === 'Campionatul Național') {
                    return comp.includes('campionatul national');
                }

                if (activeCompetition === 'Cupa National') {
                    return comp.includes('cupa national');
                }

                if (activeCompetition === 'Cupa Elite') {
                    return comp.includes('cupa elite');
                }

                if (activeCompetition === 'AMFB') {
                    return comp.includes('amfb');
                }

                return true;
            });
        }

        function getNewStarsHomeAway(ev) {
            const home = ev.home && ev.home !== 'Gazde' ? ev.home : 'New Stars';
            const away = ev.away && ev.away !== 'Adversari' ? ev.away : (ev.opponent || 'Adversar');
            return {home, away};
        }

        function isCompletedMatch(ev) { return typeof ev.score === 'string' && ev.score.trim() !== ''; }

        function renderTeamModern(name, align='center') {
            const logo = getTeamLogo(name);
            const cls = align === 'right' ? 'modern-team text-right' : 'modern-team';
            return `<div class="${cls}">${logo ? `<img src="${logo}" alt="${name}" loading="lazy">` : `<span class="fallback">${initials(name)}</span>`}<div class="modern-team-name">${name}</div></div>`;
        }

        function renderVideoLinks(ev) {
            if (!ev.videoLinks || !ev.videoLinks.length) return '';
            return `<div class="video-modern">${ev.videoLinks.map(link => {
                const url = link.url || link;
                const label = link.label || 'Video Meci';
                if (!url) return '';
                return `<a href="${url}" target="_blank" rel="noopener noreferrer">▶ ${label}</a>`;
            }).join('')}</div>`;
        }

        function renderScorersModern(ev) {
            if (!ev.scorers || typeof ev.scorers !== 'string' || !ev.scorers.trim()) return '';
            const entries = ev.scorers.split(/[|,]/).map(s => s.trim()).filter(Boolean);
            if (!entries.length) return '';
            return `<div class="scorers-modern">${entries.map(entry => {
                const goals = (entry.match(/⚽/g)||[]).length;
                const name = entry.replace(/⚽/g,'').trim();
                return goals ? `<div class="scorer-line"><span>${name}</span><span>${'⚽'.repeat(goals)}</span></div>` : '';
            }).join('')}</div>`;
        }

        function renderMatchCard(ev, completed) {
            const {home, away} = getNewStarsHomeAway(ev);
            const style = getCompStyle(ev.comp || '');
            const compClass = getCompetitionKey(ev.comp)==='Campionatul Național' ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : getCompetitionKey(ev.comp)==='Cupa National' ? 'text-sky-700 bg-sky-50 border-sky-200' : 'text-rose-700 bg-rose-50 border-rose-200';
            return `<article class="match-card-modern">
                <div class="match-topline"><span class="match-date">${formatDateRO(ev.date)}</span><span class="match-comp ${compClass}">${ev.comp || ''}</span></div>
                <div class="match-row">
                    ${renderTeamModern(home)}
                    <div class="text-center">${completed ? `<div class="result-score-big">${ev.score}</div>` : `<div class="vs-small">VS</div>`}</div>
                    ${renderTeamModern(away)}
                </div>
                ${completed ? renderScorersModern(ev) : `<div class="match-meta-modern">${ev.time ? '⏰ '+ev.time : ''}${ev.location ? (ev.time ? ' · ' : '')+'📍 '+ev.location : ''}</div>`}
                ${renderVideoLinks(ev)}
            </article>`;
        }

        function renderEvents() {
            const data = getFilteredData();
            const upcomingList = document.getElementById('upcoming-list');
            const resultsList = document.getElementById('results-list');
            if (!upcomingList || !resultsList) return;

            upcomingList.innerHTML = '';
            resultsList.innerHTML = '';

            let events = data;
            if (selectedDate) {
                events = events.filter(e => e.date === selectedDate);
            }

            const completed = events
                .filter(e => isCompletedMatch(e))
                .sort((a,b) => new Date(b.date) - new Date(a.date));

            const upcoming = events
                .filter(e => !isCompletedMatch(e))
                .sort((a,b) => new Date(a.date) - new Date(b.date));

            // If a calendar date is selected, show that day's matches in the
            // appropriate section. Otherwise show all future / past matches.
            if (!upcoming.length) {
                upcomingList.innerHTML = `<div class="bg-white p-7 text-center rounded-2xl border border-slate-200 text-slate-500 font-semibold">Nu există meciuri viitoare pentru selecția curentă.</div>`;
            } else {
                upcoming.forEach(ev => upcomingList.insertAdjacentHTML('beforeend', renderMatchCardWithNavigation(ev, false)));
            }

            if (!completed.length) {
                resultsList.innerHTML = `<div class="bg-white p-7 text-center rounded-2xl border border-slate-200 text-slate-500 font-semibold">Nu există rezultate pentru selecția curentă.</div>`;
            } else {
                completed.forEach(ev => resultsList.insertAdjacentHTML('beforeend', renderMatchCardWithNavigation(ev, true)));
            }

            const clearBtn = document.getElementById('clear-date');
            if (clearBtn) clearBtn.classList.toggle('hidden', !selectedDate);
        }

        function renderMatchCardWithNavigation(ev, completed) {
            const {home, away} = getNewStarsHomeAway(ev);
            const compKey = getCompetitionKey(ev.comp || '');
            const compClass =
                compKey === 'Campionatul Național'
                    ? 'text-emerald-700 bg-emerald-50 border-emerald-200'
                    : compKey === 'Cupa National'
                        ? 'text-sky-700 bg-sky-50 border-sky-200'
                        : 'text-rose-700 bg-rose-50 border-rose-200';

            const isNewStarsAway =
                normalizeTeamName(away) === normalizeTeamName('New Stars');

            // Excepție: la U15, competiția AMFB afișează mereu navigarea
            // (Waze/Google/Apple), chiar dacă New Stars este gazdă.
            const isAmfbException =
                normalizeCompetitionName(ev.comp).includes('amfb');

            let navigation = '';
            if (!completed && (isNewStarsAway || isAmfbException) && ev.lat && ev.lng) {
                navigation = `
                    <div class="match-navigation">
                        <div class="match-location">📍 ${ev.location || 'Stadion'}</div>
                        <div class="navigation-buttons">
                            <a href="https://www.waze.com/ul?ll=${ev.lat},${ev.lng}&navigate=yes" target="_blank" rel="noopener noreferrer" aria-label="Navigare Waze"><i class="fa-brands fa-waze"></i><span>Waze</span></a>
                            <a href="https://www.google.com/maps/search/?api=1&query=${ev.lat},${ev.lng}" target="_blank" rel="noopener noreferrer" aria-label="Navigare Google Maps"><i class="fa-solid fa-map-location-dot"></i><span>Google</span></a>
                            <a href="http://maps.apple.com/?q=${ev.lat},${ev.lng}" target="_blank" rel="noopener noreferrer" aria-label="Navigare Apple Maps"><i class="fa-brands fa-apple"></i><span>Apple</span></a>
                        </div>
                    </div>`;
            } else if (!completed && !isNewStarsAway && ev.location) {
                navigation = `<div class="match-meta-modern">📍 ${ev.location}</div>`;
            }

            return `
                <article class="match-card-modern">
                    <div class="match-topline">
                        <span class="match-date">${formatDateRO(ev.date)}${ev.time ? ' · ' + ev.time : ''}</span>
                        <span class="match-comp ${compClass}">${ev.comp || ''}</span>
                    </div>
                    <div class="match-title-modern">${ev.title || ''}</div>

                    <div class="match-row">
                        ${renderTeamModern(home)}
                        <div class="text-center">
                            ${completed
                                ? `<div class="result-score-big">${ev.score}</div>`
                                : `<div class="vs-small">VS</div>`}
                        </div>
                        ${renderTeamModern(away)}
                    </div>

                    ${completed ? renderScorersModern(ev) : navigation}
                    ${renderVideoLinks(ev)}
                </article>`;
        }





        function updateCompetitionButtons() {
            document.querySelectorAll('.comp-filter').forEach(btn => btn.classList.toggle('active', btn.dataset.comp === activeCompetition));
        }

        document.querySelectorAll('.comp-filter').forEach(btn => btn.addEventListener('click', () => {
            activeCompetition = btn.dataset.comp;
            selectedDate = null;
            updateCompetitionButtons();
            renderCalendar();
            renderEvents();
            renderNextMatch();
        }));

        function clearSelectedDate() { selectedDate = null; renderCalendar(); renderEvents(); }
        function goToday() { const d=new Date(); currentMonth=d.getMonth(); currentYear=d.getFullYear(); selectedDate=null; renderCalendar(); renderEvents(); }



        window.onload = init;
        setInterval(updateCountdown, 1000);
    
function goToNav(id, button){
    document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));
    if(button) button.classList.add('active');

    let target = document.getElementById(id);
    if (!target && id === 'upcoming-section') target = document.getElementById('upcoming-nav-target');
    if (!target && id === 'results-section') target = document.getElementById('results-nav-target');
    if (!target && id === 'scorers-section') target = document.getElementById('scorers-nav-target') || document.getElementById('golgheteri-anchor');
    if (!target && id === 'calendar-section') target = document.getElementById('calendar-anchor');

    if(target) {
        target.scrollIntoView({behavior:'smooth', block:'start'});
    }
}

function goToNavFixed(id, button){
    document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
    if(button) button.classList.add('active');

    const target = document.getElementById(id);
    if(!target) return;

    const topBar = document.querySelector('.sticky-category-nav');
    const topOffset = topBar ? topBar.getBoundingClientRect().height + 12 : 12;
    const y = target.getBoundingClientRect().top + window.pageYOffset - topOffset;
    window.scrollTo({top: Math.max(0, y), behavior:'smooth'});
}
</script>
    <nav class="bottom-nav" aria-label="Navigare rapidă">
  <div>
    <button type="button" aria-label="Acasă" onclick="goHomeTop()"><i class="fa-solid fa-house"></i></button>
    <button type="button" aria-label="Calendar" onclick="goToNavFixed('calendar-anchor', this)"><i class="fa-solid fa-calendar-days"></i></button>
    <button type="button" aria-label="Meciuri" onclick="goToNavFixed('events-anchor', this)"><i class="fa-solid fa-futbol"></i></button>
    <button type="button" aria-label="Rezultate" onclick="goToNavFixed('results-nav-target', this)"><i class="fa-solid fa-clipboard-check"></i></button>
    <button type="button" aria-label="Golgheteri" onclick="goToNavFixed('scorers-nav-target', this)"><i class="fa-solid fa-trophy"></i></button>
  </div>
</nav>
